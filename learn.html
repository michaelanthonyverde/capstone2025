<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRE Vocabulary - Learn</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <header class="site-header" role="banner">
    <div class="site-header__inner">
      <div class="site-title">Group 2's AI-Powered GRE Vocabulary</div>
      <div class="site-header__right">
        <div class="site-user" id="siteUser" aria-live="polite"></div>
        <nav class="site-nav" aria-label="Main">
          <a href="index.html" class="site-nav__link">Home</a>
          <a href="learn.html" class="site-nav__link is-active">Learn</a>
          <a href="quiz.html" class="site-nav__link">Quiz</a>
          <a href="profile.html" class="site-nav__link">Profile</a>
          <a href="aboutus.html" class="site-nav__link">About</a>
          <a href="login.html" class="site-nav__link" id="navLogin">Login</a>
          <button type="button" class="site-nav__link site-nav__button" id="navLogout" hidden>Logout</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="container section-lg">
    <div class="card">
      <h1>Learn</h1>
      <p class="muted">Study one GRE word at a time with focused review.</p>
    </div>  
    <div class="row" id="learnTabs" style="gap:8px; margin:16px 0; flex-wrap:wrap;">
      <button class="btn btn-ghost pill is-active" data-filter="all">All</button>
      <button class="btn btn-ghost pill" data-filter="high_frequency">High Frequency</button>
      <button class="btn btn-ghost pill" data-filter="basic">Basic</button>
      <button class="btn btn-ghost pill" data-filter="common">Common</button>
      <button class="btn btn-ghost pill" data-filter="advanced">Advanced</button>
    </div>        
    <section class="card" aria-live="polite">
      <div class="row" style="justify-content:space-between; align-items:flex-start; gap:12px;">
        <h2 id="learnWord" style="margin:0;"></h2>
        <div class="row" style="gap:8px; flex-wrap:wrap;">
          <span id="learnPOS" class="muted"></span>
          <span id="learnDifficulty" class="muted"></span>
        </div>
      </div>

      <div style="margin-top:12px;">
        <div class="muted" style="margin-bottom:4px;">Definition</div>
        <p id="learnDefinition" style="margin:0;"></p>
      </div>

      <div style="margin-top:12px;">
        <div class="muted" style="margin-bottom:4px;">Example</div>
        <p id="learnExample" class="muted" style="margin:0;"></p>
      </div>
    </section>

    <div class="row" style="gap:8px; justify-content:center; margin-top:16px;">
      <button id="btnPrev" class="btn btn-ghost">Previous</button>
      <button id="btnNext" class="btn btn-ghost">Next</button>
      <button id="btnShuffle" class="btn btn-ghost">Shuffle</button>
      <button id="btnReveal" class="btn btn-primary">Reveal</button>
    </div>

    <div class="muted" id="learn-live" aria-live="polite"></div>
  </main>
  <script src="learn.js"></script>
</body>
</html>
