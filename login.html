<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GRE Vocabulary App</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body class="login-page">
  <header class="site-header" role="banner">
    <div class="site-header__inner">
      <div class="site-title">Group 2's AI-Powered GRE Vocabulary</div>
      <div class="site-header__right">
        <div class="site-user" id="siteUser" aria-live="polite"></div>
        <nav class="site-nav" aria-label="Main">
          <a href="index.html" class="site-nav__link">Home</a>
          <a href="learn.html" class="site-nav__link">Learn</a>
          <a href="quiz.html" class="site-nav__link">Quiz</a>
          <a href="profile.html" class="site-nav__link">Profile</a>
          <a href="aboutus.html" class="site-nav__link">About</a>
          <a href="login.html" class="site-nav__link is-active" id="navLogin">Login</a>
          <button type="button" class="site-nav__link site-nav__button" id="navLogout" hidden>Logout</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="container login-main">
    <div class="login-card card login-container">
      <h1>Choose a display name</h1>
      <p class="muted">This name is stored only in your browser to personalize your experience.</p>
      <form id="loginForm" class="login-form" novalidate>
        <label class="form-field">
          <span class="form-label">Display name</span>
          <input type="text" id="displayNameInput" name="displayName" autocomplete="off" required>
        </label>
        <p class="login-error" id="loginError" role="status" aria-live="polite"></p>
        <button type="submit" class="btn login-submit">Continue</button>
      </form>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const nameInput = document.getElementById('displayNameInput');
      const errorEl = document.getElementById('loginError');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        errorEl.textContent = '';

        const name = (nameInput.value || '').trim();
        if (!name) {
          errorEl.textContent = 'Please enter a display name.';
          nameInput.focus();
          return;
        }

        if (window.greAuth && typeof window.greAuth.setUserName === 'function') {
          window.greAuth.setUserName(name);
          if (typeof window.greAuth.updateHeader === 'function') {
            window.greAuth.updateHeader();
          }
        } else {
          localStorage.setItem('gre.userName', name);
        }

        window.location.href = 'profile.html';
      });
    });
  </script>
</body>
</html>
