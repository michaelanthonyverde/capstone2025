<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRE Vocabulary - Profile</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <header class="site-header" role="banner">
    <div class="site-header__inner">
      <div class="site-title">Group 2's AI-Powered GRE Vocabulary</div>
      <div class="site-header__right">
        <div class="site-user" id="siteUser" aria-live="polite"></div>
        <nav class="site-nav" aria-label="Main">
          <a href="index.html" class="site-nav__link">Home</a>
          <a href="learn.html" class="site-nav__link">Learn</a>
          <a href="quiz.html" class="site-nav__link">Quiz</a>
          <a href="profile.html" class="site-nav__link is-active">Profile</a>
          <a href="aboutus.html" class="site-nav__link">About</a>
          <a href="login.html" class="site-nav__link" id="navLogin">Login</a>
          <button type="button" class="site-nav__link site-nav__button" id="navLogout" hidden>Logout</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="container section-lg">
    <div class="card profile-card fade-slide" id="profileSignedIn" hidden>
      <h1 id="profileGreeting">Welcome back</h1>
      <p class="muted" id="profileDescription">This profile uses your local display name to personalize your GRE vocab practice.</p>
      <div class="profile-actions">
        <button type="button" class="btn" id="profileLogout">Logout</button>
      </div>
    </div>

    <div class="card fade-slide" id="profileSignedOut" hidden>
      <h1>You're not signed in</h1>
      <p class="muted">Add a display name to personalize your GRE vocabulary study.</p>
      <div class="profile-actions">
        <a class="btn" href="login.html">Set display name</a>
      </div>
    </div>
  </main><script>
    document.addEventListener('DOMContentLoaded', () => {
      const name = (localStorage.getItem('gre.userName') || '').trim();
      const isSignedIn = !!name;
      const signedInCard = document.getElementById('profileSignedIn');
      const signedOutCard = document.getElementById('profileSignedOut');
      const greeting = document.getElementById('profileGreeting');
      const desc = document.getElementById('profileDescription');

      if (signedInCard) signedInCard.hidden = !isSignedIn;
      if (signedOutCard) signedOutCard.hidden = isSignedIn;

      if (isSignedIn) {
        if (greeting) greeting.textContent = `Welcome back, ${name}`;
        if (desc) desc.textContent = 'Your display name lives in this browser and keeps your quiz experience personal.';
      }
    });
  </script>
</body>
</html>
