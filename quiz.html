<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRE Vocabulary Quiz</title>
    <link rel="stylesheet" href="style.css" />
    <script src="auth.js" defer></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="site-header__inner">
        <div class="site-title">Group 2's AI-Powered GRE Vocabulary</div>
        <div class="site-header__right">
          <div class="site-user" id="siteUser" aria-live="polite"></div>
          <nav class="site-nav" aria-label="Main">
            <a href="index.html" class="site-nav__link">Home</a>
            <a href="learn.html" class="site-nav__link">Learn</a>
            <a href="quiz.html" class="site-nav__link is-active">Quiz</a>
            <a href="profile.html" class="site-nav__link">Profile</a>
            <a href="aboutus.html" class="site-nav__link">About</a>
            <a href="login.html" class="site-nav__link" id="navLogin">Login</a>
            <button type="button" class="site-nav__link site-nav__button" id="navLogout" hidden>Logout</button>
          </nav>
        </div>
      </div>
    </header>
    <div id="root"></div>
    <div class="sr-status" aria-live="polite">Status</div>

    <script type="text/babel">
      const ACTIONS = ["noHint", "lightHint", "strongHint"];
      const EPSILON = 0.2;
      const ALPHA = 0.3;
      const GAMMA = 0.9;

      const DREAM_WORD_GIFS = {
        oneiric: "./data/dream1.gif",
        hypnagogic: "./data/dream2.gif",
        surreal: "./data/dream3.gif",
        lucid: "./data/dream4.gif",
        reverie: "./data/dream5.gif"
      };

      function getDreamGifForWord(term) {
        if (!term) return null;
        const key = String(term).toLowerCase();
        return DREAM_WORD_GIFS[key] || null;
      }

      function getWordId(word){
        return String(word && word.term ? word.term : "").toLowerCase();
      }

      function readStorage(key){
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch(e){
          return {};
        }
      }

      function writeStorage(key, value){
        try { localStorage.setItem(key, JSON.stringify(value)); } catch(e){ }
      }

      const PROMPT_TEMPLATES = [
        (term) => `What is the definition of ${term}?`,
        (term) => `Which of the following best defines "${term}"?`,
        (term) => `"${term}" most nearly means:`,
        (term) => `Choose the best definition for "${term}".`
      ];

      function buildPrompt(term){
        const idx = Math.floor(Math.random() * PROMPT_TEMPLATES.length);
        return PROMPT_TEMPLATES[idx](term);
      }

      function getWordStats(){
        return readStorage("wordStats");
      }

      function setWordStats(stats){
        writeStorage("wordStats", stats);
      }

      function updateWordStats(wordId, isCorrect){
        const stats = getWordStats();
        const entry = stats[wordId] || { seen: 0, correct: 0, incorrect: 0, learned: false };
        entry.seen += 1;
        if (isCorrect) entry.correct += 1;
        else entry.incorrect += 1;
        const total = (entry.correct || 0) + (entry.incorrect || 0);
        const accuracy = total > 0 ? entry.correct / total : 0;
        entry.learned = total >= 3 && accuracy >= 0.7;
        stats[wordId] = entry;
        setWordStats(stats);
      }

      function getHintTable(){
        return readStorage("hintQTable");
      }

      function setHintTable(table){
        writeStorage("hintQTable", table);
      }

      function ensureHintRow(table, wordId){
        if (!table[wordId]) table[wordId] = {};
        ACTIONS.forEach(a => {
          if (typeof table[wordId][a] !== "number") table[wordId][a] = 0;
        });
        return table;
      }

      function chooseHintType(wordId){
        let table = getHintTable();
        table = ensureHintRow(table, wordId);
        setHintTable(table);
        if (Math.random() < EPSILON){
          const idx = Math.floor(Math.random() * ACTIONS.length);
          return ACTIONS[idx];
        }
        const row = table[wordId];
        return ACTIONS.reduce((best, action) => {
          if (best === null) return action;
          return row[action] > row[best] ? action : best;
        }, null);
      }

      function updateQValue(wordId, action, reward){
        let table = getHintTable();
        table = ensureHintRow(table, wordId);
        const row = table[wordId];
        const current = row[action];
        const maxNext = Math.max(...ACTIONS.map(a => row[a]));
        const updated = current + ALPHA * (reward + GAMMA * maxNext - current);
        row[action] = updated;
        setHintTable(table);
      }

      function QuizPage() {
        const [dataUrl] = React.useState("./Data/words_difficulty.json");
        const [allWords, setAllWords] = React.useState(null);
        const [error, setError] = React.useState("");
        const [difficulty, setDifficulty] = React.useState("all");
        const [countMode, setCountMode] = React.useState(() => localStorage.getItem('gre.countMode') || '20');
        const [customCount, setCustomCount] = React.useState(() => {
          const v = parseInt(localStorage.getItem('gre.customCount') || '20', 10);
          return Number.isFinite(v) && v > 0 ? v : 20;
        });
        const [quizMode, setQuizMode] = React.useState('quick');
        const [started, setStarted] = React.useState(false);
        const [qIdx, setQIdx] = React.useState(0);
        const [score, setScore] = React.useState(0);
        const [locked, setLocked] = React.useState(false);
        const [feedback, setFeedback] = React.useState(null);
        const [restrictTerms, setRestrictTerms] = React.useState(null);
        const [sessionResults, setSessionResults] = React.useState([]);
        const [hintType, setHintType] = React.useState("noHint");
        const [dreamGif, setDreamGif] = React.useState(null);
        const [showHint, setShowHint] = React.useState(false);

        React.useEffect(() => {
          (async () => {
            try {
              const r = await fetch(dataUrl, { cache: "no-store" });
              if (!r.ok) throw new Error("Fetch failed");
              const j = await r.json();
              setAllWords(j);
            } catch (e) {
              setError("Couldn't load words_difficulty.json - using fallback.");
              setAllWords([
                { term: "pithy", definition: "concise and forcefully expressive", difficulty: "high_frequency" },
                { term: "abate", definition: "to become less intense or widespread", difficulty: "common" },
                { term: "erudite", definition: "having or showing great knowledge", difficulty: "advanced" }
              ]);
            }
          })();
        }, []);

        React.useEffect(() => {
          try {
            const sel = sessionStorage.getItem('gre.learnSelection');
            if (sel) {
              const parsed = JSON.parse(sel);
              if (parsed && Array.isArray(parsed.terms) && parsed.terms.length) {
                setRestrictTerms(new Set(parsed.terms.map(t => String(t).toLowerCase())));
              }
            }
          } catch(e) { }
        }, []);

        function cleanDefinition(raw, term) {
          if (!raw || typeof raw !== "string") return "";
          const firstBlock = raw.split(/\n{2,}/)[0].trim();
          const t = (term || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const withWordPos = new RegExp('^\\s*' + t + '\\s+\\(?(?:adjective|adj|noun|n|verb|v|adverb|adv|vt|vi)\\.?\\)?\\s*:\\s*', 'i');
          let s = firstBlock.replace(withWordPos, '');
          s = s.replace(/^\s*\(?(?:adjective|adj|noun|n|verb|v|adverb|adv|vt|vi)\.?\)?\s*:\s*/i, '');
          s = s.replace(/\s+/g, ' ').trim();
          return s;
        }

        const filtered = React.useMemo(() => {
          if (!allWords) return [];
          let pool = allWords.filter(w => w.term && w.definition);
          pool = pool.map(w => ({ ...w, cleanDef: cleanDefinition(w.definition, w.term) }))
                     .filter(w => w.cleanDef);
          if (restrictTerms) {
            pool = pool.filter(w => restrictTerms.has(String(w.term).toLowerCase()));
          }
          if (difficulty !== "all") pool = pool.filter(w => (w.difficulty || "").toLowerCase() === difficulty);
          return pool;
        }, [allWords, difficulty, restrictTerms]);

        const availableCount = filtered.length;
        const chosenCount = React.useMemo(() => {
          if (countMode === 'all') return availableCount;
          if (countMode === 'custom') return customCount;
          const n = parseInt(countMode, 10);
          return Number.isFinite(n) ? n : 20;
        }, [countMode, customCount, availableCount]);
        const countError = React.useMemo(() => {
          if (countMode !== 'custom') return '';
          if (!Number.isInteger(customCount) || customCount < 1) return 'Enter a number >= 1';
          if (customCount > availableCount) return `Max available for this difficulty is ${availableCount}`;
          return '';
        }, [countMode, customCount, availableCount]);
        const canStart = quizMode === 'dream' ? true : (availableCount > 0 && !countError);

        React.useEffect(() => {
          localStorage.setItem('gre.countMode', String(countMode));
        }, [countMode]);
        React.useEffect(() => {
          if (Number.isFinite(customCount)) {
            localStorage.setItem('gre.customCount', String(customCount));
          }
        }, [customCount]);

        React.useEffect(() => {
          if (!feedback) return;
          const t = setTimeout(() => setFeedback(null), 1100);
          return () => clearTimeout(t);
        }, [feedback]);

        const [questions, setQuestions] = React.useState([]);

        function shuffle(arr){
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--){
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        }

        function buildChoices(correct, pool){
          const uniqueDefs = Array.from(new Set(pool));
          const wrongs = shuffle(uniqueDefs.filter(d => d !== correct)).slice(0,3);
          return shuffle([correct, ...wrongs]);
        }

        function speak(text){
          try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(u);
          } catch (e) {
            console.error("Speech synthesis failed:", e);
          }
        }

        function readQuestionAndChoices() {
          if (!questions || !questions.length) return;
          const q = questions[qIdx];
          if (!q) return;
          const choicesText = q.choices && q.choices.length
            ? q.choices.join(", ")
            : "";
          const fullText = choicesText
            ? `${q.prompt}. Choices: ${choicesText}.`
            : q.prompt;
          speak(fullText);
        }

        function forceHintNow() {
          if (hintType === "noHint") {
            setHintType("definition");
          }
          setShowHint(true);
        }

        function startQuiz(){
          setDreamGif(null);
          if (quizMode === 'dream'){
            fetch("./data/dream_words.json", { cache: "no-store" })
              .then(r => {
                if (!r.ok) throw new Error("Dream fetch failed");
                return r.json();
              })
              .then(dreamWords => {
                const normalized = (Array.isArray(dreamWords) ? dreamWords : [])
                  .filter(w => w && w.term && w.definition)
                  .map(w => ({ ...w, cleanDef: cleanDefinition(w.definition, w.term) }))
                  .filter(w => w.cleanDef);
                const defs = normalized.map(w => w.cleanDef);
                const qs = normalized.map(w => ({
                  word: w,
                  prompt: buildPrompt(w.term),
                  correct: w.cleanDef,
                  choices: []
                }));
                qs.forEach(q => q.choices = buildChoices(q.correct, defs));
                setQuestions(qs);
                setStarted(true);
                setQIdx(0);
                setScore(0);
                setLocked(false);
                setSessionResults([]);
                setHintType("noHint");
                setShowHint(false);
              })
              .catch(() => {
                setError("Couldn't load dream words.");
                setQuestions([]);
                setStarted(false);
              });
            return;
          }
          const pool = filtered.slice();
          const finalCount = Math.min(chosenCount, pool.length);
          const chosen = shuffle(pool).slice(0, finalCount);
          const defs = chosen.map(w => w.cleanDef);
          const qs = chosen.map(w => ({
            word: w,
            prompt: buildPrompt(w.term),
            correct: w.cleanDef,
            choices: []
          }));
          qs.forEach(q => q.choices = buildChoices(q.correct, defs));
          setQuestions(qs);
          setStarted(true);
          setQIdx(0);
          setScore(0);
          setLocked(false);
          setSessionResults([]);
          setHintType("noHint");
          setShowHint(false);
        }

        function onAnswer(choice){
          if (locked) return;
          const q = questions[qIdx];
          const isCorrect = choice === q.correct;
          const wordId = getWordId(q.word);
          const reward = isCorrect ? (hintType === "noHint" ? 1 : 0.5) : -0.5;
          const currentTerm = q && q.word && q.word.term;
          if (quizMode === 'quick') {
            setLocked(true);
            if (isCorrect) setScore(s => s + 1);
          } else {
            if (isCorrect) {
              setLocked(true);
              setScore(s => s + 1);
            } else {
              setLocked(false);
            }
          }
          if (quizMode === 'dream') {
            if (!isCorrect) {
              setDreamGif(getDreamGifForWord(currentTerm));
            } else {
              setDreamGif(null);
            }
          } else {
            setDreamGif(null);
          }
          setSessionResults(prev => ([
            ...prev,
            {
              index: qIdx,
              term: q.word.term,
              difficulty: (q.word.difficulty || '').toLowerCase(),
              definition: q.word.cleanDef || q.correct,
              partOfSpeech: (q.word.linguistics && (q.word.linguistics.part_of_speech || q.word.linguistics.partOfSpeech)) || '',
              example: q.word.example || '',
              chosen: choice,
              isCorrect
            }
          ]));
          updateWordStats(wordId, isCorrect);
          updateQValue(wordId, hintType, reward);
          setFeedback({ type: isCorrect ? 'correct' : 'incorrect', id: Date.now() });
        }

        function next(){
          setDreamGif(null);
          if (qIdx + 1 < questions.length){
            setQIdx(i => i + 1);
            setLocked(false);
            setShowHint(false);
          } else {
            const total = questions.length;
            const correct = score;
            const percent = total ? Math.round((correct / total) * 100) : 0;
            const byDifficulty = sessionResults.reduce((acc, r) => {
              const key = r.difficulty || 'unknown';
              if (!acc[key]) acc[key] = { total: 0, correct: 0 };
              acc[key].total += 1;
              if (r.isCorrect) acc[key].correct += 1;
              return acc;
            }, {});
            const summary = { total, correct, percent, byDifficulty };
            try {
              sessionStorage.setItem('gre.summary', JSON.stringify(summary));
              sessionStorage.setItem('gre.results', JSON.stringify(sessionResults));
            } catch(e) { }
            window.location.href = 'results.html';
          }
        }

        const progressPct = questions.length ? Math.round((qIdx / questions.length) * 100) : 0;

        function getHintText(word, type){
          if (!word) return "";
          if (type === "noHint") return "";
          const def = word.cleanDef || word.definition || "";
          const example = word.example || "";
          if (type === "lightHint"){
            const snippet = def.split(/\s+/).slice(0, 6).join(" ");
            return snippet ? `${snippet}...` : (example ? example.slice(0, 40) + "..." : "");
          }
          if (type === "strongHint"){
            if (def) return def;
            return example;
          }
          return "";
        }

        React.useEffect(() => {
          if (!started || !questions.length) return;
          const q = questions[qIdx];
          if (!q || !q.word) return;
          const wordId = getWordId(q.word);
          const selectedHint = chooseHintType(wordId);
          setHintType(selectedHint);
          setShowHint(false);
        }, [started, qIdx, questions]);

        return (
          <div className="container">
            <h1>GRE Vocabulary Quiz</h1>

            {error && (
              <p className="muted fade-slide" aria-live="polite">
                {error}
              </p>
            )}

            {feedback && (
              <div
                className={`toast ${feedback.type}`}
                role="status"
                aria-live="assertive"
              >
                {feedback.type === "correct" ? "Correct" : "Incorrect"}
              </div>
            )}

            {!started && (
              <div className="card">
                <label>
                  Difficulty
                  <select
                    value={difficulty}
                    onChange={(e) => setDifficulty(e.target.value)}
                    style={{ marginLeft: 8 }}
                  >
                    <option value="all">All</option>
                    <option value="high_frequency">High Frequency</option>
                    <option value="basic">Basic</option>
                    <option value="common">Common</option>
                    <option value="advanced">Advanced</option>
                  </select>
                </label>

                <div
                  className="row"
                  style={{ marginTop: 8, alignItems: "center", gap: 8 }}
                >
                  <label>
                    Questions
                    <select
                      value={countMode}
                      onChange={(e) => setCountMode(e.target.value)}
                      style={{ marginLeft: 8 }}
                    >
                      <option value={"10"}>10</option>
                      <option value={"20"}>20</option>
                      <option value={"50"}>50</option>
                      <option value={"100"}>100</option>
                      <option value={"custom"}>Custom</option>
                      <option value={"all"}>All</option>
                    </select>
                  </label>

                  {countMode === "custom" && (
                    <label style={{ marginLeft: 8 }}>
                      Count
                      <input
                        type="number"
                        value={customCount}
                        min={1}
                        max={availableCount || 1}
                        step={1}
                        onChange={(e) =>
                          setCustomCount(
                            parseInt(e.target.value || "0", 10)
                          )
                        }
                        style={{
                          marginLeft: 8,
                          padding: "6px 8px",
                          borderRadius: 12,
                          border: "1px solid #B2B4B2",
                          width: 96
                        }}
                      />
                    </label>
                  )}

                  {countError && (
                    <span className="muted" style={{ marginLeft: 8 }}>
                      {countError}
                    </span>
                  )}

                  <div className="row" style={{ marginLeft: 8, gap: 12 }}>
                    <label className="muted">
                      <input
                        type="radio"
                        name="mode"
                        value="quick"
                        checked={quizMode === "quick"}
                        onChange={() => setQuizMode("quick")}
                        style={{ marginRight: 6 }}
                      />
                      Quick Quiz
                    </label>

                    <label className="muted">
                      <input
                        type="radio"
                        name="mode"
                        value="study"
                        checked={quizMode === "study"}
                        onChange={() => setQuizMode("study")}
                        style={{ marginRight: 6 }}
                      />
                      Study Quiz
                    </label>

                    <label className="muted">
                      <input
                        type="radio"
                        name="mode"
                        value="dream"
                        checked={quizMode === "dream"}
                        onChange={() => setQuizMode("dream")}
                        style={{ marginRight: 6 }}
                      />
                      Dream Quiz
                    </label>
                  </div>

                  <button
                    className="btn"
                    disabled={!canStart}
                    onClick={startQuiz}
                    style={{ marginLeft: 8 }}
                  >
                    Start
                  </button>
                </div>
              </div>
            )}

            {started && questions.length > 0 && (
              <div>
                {quizMode === "dream" && dreamGif && (
                  <div
                    className="card"
                    style={{ marginBottom: 12, textAlign: "center" }}
                  >
                    <img
                      src={dreamGif}
                      alt="Dream Quiz hint"
                      style={{
                        maxWidth: "100%",
                        maxHeight: "240px",
                        borderRadius: "12px"
                      }}
                    />
                  </div>
                )}

                <div className="card">
                  <div
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "center"
                    }}
                  >
                    <div>
                      <b>Score:</b> {score} / {qIdx}
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button
                        className="btn"
                        onClick={() => speak(questions[qIdx].word.term)}
                      >
                        Speak
                      </button>
                      <button
                        className="btn"
                        onClick={readQuestionAndChoices}
                      >
                        Read Question & Choices
                      </button>
                    </div>
                  </div>

                  <div className="progress quiz-progress">
                    <div
                      className="progress-fill"
                      style={{ width: `${progressPct}%` }}
                    ></div>
                  </div>

                  <div className="question-block">
                    <h2>{questions[qIdx].prompt}</h2>
                    {questions[qIdx].choices.map((c) => (
                      <button
                        key={c}
                        disabled={locked}
                        className="btn answer"
                        onClick={() => onAnswer(c)}
                      >
                        {c}
                      </button>
                    ))}

                    <div style={{ marginTop: 12 }}>
                      <button
                        type="button"
                        className="btn btn-ghost"
                        onClick={() => setShowHint((prev) => !prev)}
                      >
                        {showHint ? "Hide Hint" : "Show Hint"}
                      </button>
                      <div style={{ marginTop: 8 }}>
                        <button
                          type="button"
                          className="btn btn-ghost"
                          onClick={forceHintNow}
                        >
                          Force Hint
                        </button>
                      </div>
                    </div>
                  </div>

                  <div
                    className="hint-area"
                    aria-live="polite"
                    style={{ marginTop: 12 }}
                  >
                    {hintType === "noHint" ? (
                      <span className="muted">
                        No hint selected for this question.
                      </span>
                    ) : showHint ? (
                      <span>
                        <b>Hint:</b>{" "}
                        {getHintText(questions[qIdx].word, hintType)}
                      </span>
                    ) : (
                      <span className="muted">
                        Hint available. Use the "Show Hint" button above to reveal it.
                      </span>
                    )}
                  </div>

                  {locked && (
                    <button className="btn" onClick={next}>
                      Next
                    </button>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<QuizPage />);
    </script>
  </body>
  </html>
