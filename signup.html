<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - GRE Vocabulary App</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body class="login-page">
  <header class="site-header" role="banner">
    <div class="site-header__inner">
      <div class="site-title">Group 2's AI-Powered GRE Vocabulary</div>
      <div class="site-header__right">
        <div class="site-user" id="siteUser" aria-live="polite"></div>
        <nav class="site-nav" aria-label="Main">
          <a href="index.html" class="site-nav__link">Home</a>
          <a href="learn.html" class="site-nav__link">Learn</a>
          <a href="quiz.html" class="site-nav__link">Quiz</a>
          <a href="profile.html" class="site-nav__link">Profile</a>
          <a href="aboutus.html" class="site-nav__link">About</a>
          <a href="login.html" class="site-nav__link" id="navLogin">Login</a>
          <button type="button" class="site-nav__link site-nav__button" id="navLogout" hidden>Logout</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="container login-main">
    <div class="login-card card login-container">
      <h1>Create Account</h1>
      <p class="muted">Register to save your GRE vocabulary progress.</p>
      <form id="signupForm" class="login-form" novalidate>
        <label class="form-field">
          <span class="form-label">Username</span>
          <input type="text" id="signupUsername" name="username" autocomplete="username" required>
        </label>
        <label class="form-field">
          <span class="form-label">Password</span>
          <input type="password" id="signupPassword" name="password" autocomplete="new-password" required>
        </label>
        <label class="form-field">
          <span class="form-label">Confirm password</span>
          <input type="password" id="signupConfirm" name="confirm" autocomplete="new-password" required>
        </label>
        <p class="login-error" id="signupError" role="status" aria-live="polite"></p>
        <button type="submit" class="btn login-submit">Create account</button>
      </form>
      <p class="muted login-switch">Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signupForm');
      const usernameInput = document.getElementById('signupUsername');
      const passwordInput = document.getElementById('signupPassword');
      const confirmInput = document.getElementById('signupConfirm');
      const errorEl = document.getElementById('signupError');

      usernameInput.focus();

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        errorEl.textContent = '';

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        if (username.length < 3 || username.length > 30) {
          errorEl.textContent = 'Username must be between 3 and 30 characters.';
          usernameInput.focus();
          return;
        }

        if (password.length < 6) {
          errorEl.textContent = 'Password must be at least 6 characters.';
          passwordInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          errorEl.textContent = 'Passwords do not match.';
          confirmInput.focus();
          confirmInput.select();
          return;
        }

        let users = [];
        try {
          const stored = JSON.parse(localStorage.getItem('users') || '[]');
          if (Array.isArray(stored)) {
            users = stored;
          }
        } catch (err) {
          users = [];
        }

        const usernameLower = username.toLowerCase();
        const duplicate = users.some((user) => String(user.username || '').toLowerCase() === usernameLower);
        if (duplicate) {
          errorEl.textContent = 'That username is already taken. Try another one.';
          usernameInput.focus();
          usernameInput.select();
          return;
        }

        users.push({ username, password });
        localStorage.setItem('users', JSON.stringify(users));
        localStorage.setItem('loggedInUser', username);
        window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
